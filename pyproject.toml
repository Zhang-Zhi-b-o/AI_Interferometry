[project]
name = "michelson-interferometer-ai"
version = "1.0.0"
description = "迈克尔逊干涉仪智能辅助系统"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8,<5",
    "numpy>=1.24,<2",
    "scipy>=1.10,<2",
    "scikit-image>=0.21,<0.26",
    "pillow>=10,<13",
    "matplotlib>=3.8,<4",
    "pyserial>=3.5,<4",
    "pyyaml>=6,<7",
    "ultralytics>=8,<9",
    "torch>=2,<3",
    "rapidocr>=3.8.2,<4",
    "onnxruntime>=1.18,<2",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
michelson = "src.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
