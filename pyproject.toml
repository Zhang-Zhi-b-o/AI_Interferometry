[project]
name = "michelson-interferometer-ai"
version = "1.0.0"
description = "迈克尔逊干涉仪智能辅助系统"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8,<5",
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "pillow>=10,<13",
    "pyserial>=3.5,<4",
    "pyyaml>=6,<7",
    "ultralytics>=8,<9",
    "torch>=2,<3",
    "rapidocr>=3.8.2,<4",
    "onnxruntime>=1.18,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
