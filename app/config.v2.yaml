# v2 默认配置；项目根目录 config.yaml 的同名键优先。
# 只放 v2 使用的键，不迁移旧版录像、回程差和主动建议配置。
app:
  name: "白光干涉测量工作台"

ui:
  theme: "light"          # light | dark
  font_scale: 1.0         # 全局字号缩放，1.0 = 基准；嫌小可调到 1.1
  window_size: [1600, 1000]

camera:
  index: 1                # 第一相机（干涉画面）
  resolution: [1280, 1024]

vision:
  model_path: "models/current/best.pt"
  confidence: 0.25
  iou: 0.45
  imgsz: 640
  device: "cpu"           # 有 CUDA 时可改 cuda

search:
  tolerance_px: 12        # 中心偏差小于它就算居中
  stable_frames: 5
  slow_zone_px: 120       # 偏差小于它则降档减速
  tick_ms: 200
  max_seconds: 180        # 单次自动寻中上限
  direction_mode: single_direction
  recognition_mode: continuous
  search_direction: forward
  search_gear: 9
  fast_gear: 9
  slow_gear: 10
  search_initial_span_turns: 6
  search_expansion_factor: 1.6
  search_max_span_turns: 0  # 0 不限范围，仍受运行超时约束
  stop_detect_move_seconds: 0.6
  stop_detect_settle_seconds: 0.3
  stop_detect_frames: 2

reading:
  camera_index: 0         # 第二相机（微分表 LCD）
  interval_ms: 200
  resolution: [1280, 1024]

motor:
  port: "auto"
  baudrate: 9600
  default_gear: 10

measurement:
  refractive_index: 1.4586
  pixel_to_mm_ratio: 0.000444
  wavelength_nm: 589.3
  film_refractive_index: 1.523
  micrometer_accuracy_mm: 0.0001
  refractive_index_tolerance: 0.001
  confidence: 0.95

uncertainty:
  confidence_level: 0.95

agent:
  enabled: true           # 助手已接入；发送消息时才请求模型
