app:
  name: "迈克尔逊干涉仪智能辅助系统"
  version: "1.0.0"

camera:
  index: 0
  resolution: [1280, 1024]
  fps: 60

vision:
  model_path: "models/yolov8_interference.pt"
  confidence_threshold: 0.5
  iou_threshold: 0.45
  imgsz: 640
  device: "cuda"

motor:
  port: "COM3"
  baudrate: 9600
  timeout: 1.0

arduino:
  port: "COM4"
  baudrate: 9600

agent:
  llm:
    provider: "deepseek"
    api_base: "https://api.deepseek.com/v1"
    api_key: ""
    model: "deepseek-chat"
  rag:
    top_k: 5

uncertainty:
  confidence_level: 0.95
  symmetry_enabled: true

ui:
  theme: "light"
  language: "zh"
  window_size: [1600, 1000]
