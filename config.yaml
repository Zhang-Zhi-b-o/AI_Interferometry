app:
  name: "迈克尔逊干涉仪智能辅助系统"
  version: "1.0.0"

camera:
  index: 1
  resolution: [1280, 1024]
  fps: 60
  clarity_assist:
    enabled: true
    preview_exposure: -6
    preview_gain: 0
    motion_exposure: -7
    motion_gain: 80
    min_exposure: -8
    max_gain: 100
    blur_ratio: 0.55
    check_frames: 8
    trigger_checks: 2
    min_brightness_for_shorter_exposure: 20
    # 连续转动时同时作用于实时预览与 YOLO 输入，不改变画面尺寸和坐标。
    software_enhancement:
      enabled: true
      sharpen_strength: 0.65
      max_sharpen_strength: 1.35
      stripe_contrast_strength: 1.6
      max_stripe_contrast_strength: 3.0
      color_gain: 1.45
      max_color_gain: 1.9
      original_mix: 0.35
      horizontal_kernel_size: 5
      vertical_smooth_size: 9
      background_kernel_size: 31
      contrast_gain: 1.06

vision:
  model_path: "models/current/best.pt"
  confidence_threshold: 0.5
  iou_threshold: 0.45
  imgsz: 640
  device: "cuda"
  # 中心条纹二次定位范围：扩大 ROI，但仍由零级框提供位置先验。
  center_search_expand_ratio: 4.2
  center_search_radius_ratio: 1.2
  center_search_margin_ratio: 0.5
  fringe_motion_window: 8
  fringe_motion_threshold_px: 6

motor:
  port: "auto"
  baudrate: 9600
  timeout: 1.0
  # 电机自动寻中插件的默认参数。
  automatic:
    # 档位 1 最快，档位 10 最慢。
    search_gear: 9
    fast_gear: 9
    slow_gear: 10
    slow_zone_px: 160
    tolerance_px: 15
    stable_frames: 5
    dropout_hold_frames: 3
    # 连续检测到中心候选达到该帧数后，才进入“曾找到中心”状态。
    center_confirm_frames: 3
    command_refresh_frames: 10
    search_direction: "forward"
    search_mode: "bidirectional"
    invert_direction: false
    auto_learn_direction: true
    show_center_line: true
    learning_delta_px: 8
    guide_min_confidence: 0.2
    guide_loss_confirm_frames: 10
    # 无视觉路标时采用交替扩展扫描，单位为估算的电机输出轴圈数。
    search_initial_span_turns: 6
    search_expansion_factor: 1.6
    # 0 表示不设置搜索范围上限；仍受最长运行时间和人工停止保护。
    search_max_span_turns: 0
    # 连续取最新帧时高速旋转会造成运动模糊；默认保持档位 5，不再逐轮加速。
    search_min_gear: 9
    search_acceleration_step: 0
    # 连续看不到任何条纹时保持旋转，但自动降到清晰度恢复档位。
    blur_slowdown_frames: 3
    blur_safe_gear: 10
    blur_recovery_clear_frames: 5
    guide_worsening_px: 12
    guide_trend_window: 8
    # 连续线索会把搜索中心向线索方向平移，再以新中心向两侧扩大。
    guide_focus_confirm_frames: 3
    guide_focus_shift_ratio: 0.5
    guide_focus_min_shift_turns: 1
    guide_focus_max_shift_turns: 12
  safety:
    max_run_seconds: 600
    black_confirm_frames: 3
    # 已确认中心丢失后等待约 90 个推理帧，再恢复扩大范围搜索，不结束任务。
    max_missing_frames: 90

arduino:
  port: "COM4"
  baudrate: 9600

micrometer:
  # 独立摄像头拍摄数显微分表，索引可在“视觉微分表读数”模块中修改。
  model_path: "models/micrometer/PP-OCRv6_rec_small.onnx"
  camera_index: 0
  # 第二路使用较低带宽；OCR 仍在 LCD ROI 内处理，不需要主相机的高帧率。
  resolution: [960, 540]
  fps: 10
  interval_ms: 200
  # 自动定位失败时使用归一化 ROI: [x, y, width, height]。
  auto_roi: true
  roi: [0.0, 0.0, 1.0, 1.0]
  min_score: 0.45
  decimal_places: 3
  stable_window: 7
  stable_required: 3
  # 动镜实际位移 = 千分尺读数变化 × scale_factor
  scale_factor: 0.05

experiment:
  # 完整自动实验最长运行 10 分钟；紧急停车和设备失联仍会立即终止。
  max_auto_seconds: 600
  center_stable_frames: 5
  center_min_confidence: 0.18
  center_max_jitter_px: 12

agent:
  llm:
    provider: "deepseek"
    api_base: "https://api.deepseek.com"
    model: "deepseek-v4-flash"
    timeout: 30
    max_tokens: 2000
  rag:
    top_k: 4

uncertainty:
  confidence_level: 0.95
  symmetry_enabled: true

ui:
  theme: "light"
  language: "zh"
  window_size: [1600, 1000]
