app:
  name: "迈克尔逊干涉仪智能辅助系统"
  version: "1.0.0"

arduino:
  port: "COM4"
  baudrate: 9600

experiment:
  # 完整自动实验最长运行 10 分钟；紧急停车和设备失联仍会立即终止。
  max_auto_seconds: 600
  center_stable_frames: 5
  center_min_confidence: 0.18
  center_max_jitter_px: 12

temporary_measurement:
  enabled: true
  # 电机正转 → 微分表读数增大；反转 → 读数减小
  approach_gear: 10
  tolerance_mm: 0.001
  max_duration_seconds: 60
  poll_interval_ms: 250
  # 超过此时间没有新的有效 OCR 读数时立即停车等待
  reading_timeout_seconds: 1.5
  # 回程差端点只需进入附近或沿当前方向越过，禁止反向精确修正
  backlash_endpoint_tolerance_mm: 0.01

agent:
  llm:
    provider: "deepseek"
    api_base: "https://api.deepseek.com"
    model: "deepseek-v4-pro"
    timeout: 120
    max_tokens: 6000
    history_turns: 12
    history_question_chars: 1500
    history_answer_chars: 6000
    context_max_chars: 60000
  rag:
    top_k: 8
  # 自主执行智能体：模型自定计划、逐步调用工具执行测量/控制/电机任务。
  autonomous_enabled: true      # 开启后提问会走 AgentLoop（否则退回纯文本引导）
  confirm_motion: true          # 任何使电机转动的工具都需在界面人工确认
  dry_run: false                # 仅规划模式：工具只返回占位结果，不实际执行
  max_steps: 12                 # 单次任务最多工具调用轮次
  tool_timeout_seconds: 60      # 运动工具确认框的等待超时（超时视为拒绝）
  # 主动建议：让 DeepSeek 分析当前状态，给出「现状 + 下一步 + 其他建议」。
  # 为省 token：只在无操作/状态稳定一段时间后才分析（而非周期调用），
  # 且上下文精简、输出很短；离线/失败时回退本地确定性提示。
  suggestion_idle_seconds: 45    # 无操作/状态稳定多久后自动分析（秒），越长越省 token
  suggestion_max_tokens: 200     # 主动建议输出上限（短答）

uncertainty:
  confidence_level: 0.95
  symmetry_enabled: true
  # 玻璃片厚度测量 B 类不确定度的仪器参数（实验助手确定性计算用）。
  micrometer_accuracy_mm: 0.0001     # 微分表（螺旋测微器）示值允差，矩形分布半宽
  refractive_index_tolerance: 0.001  # 玻璃折射率手册允差，矩形分布半宽

ui:
  theme: "light"
  language: "zh"
  window_size: [1600, 1000]
