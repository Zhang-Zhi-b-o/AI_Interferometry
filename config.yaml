app:
  name: "迈克尔逊干涉仪智能辅助系统"
  version: "1.0.0"

camera:
  index: 0
  resolution: [1280, 1024]
  fps: 60

vision:
  model_path: "models/current/best.pt"
  confidence_threshold: 0.5
  iou_threshold: 0.45
  imgsz: 640
  device: "cuda"

motor:
  port: "COM3"
  baudrate: 9600
  timeout: 1.0
  # 自动实验内部参数，不在手动电机插件中显示。
  automatic:
    search_speed: 10
    color_speed: 5
    black_speed: 10
    black_threshold: 0.5
  safety:
    max_run_seconds: 60
    black_confirm_frames: 3
    max_missing_frames: 30

arduino:
  port: "COM4"
  baudrate: 9600

micrometer:
  # 读数接口和通信协议待硬件方案确定后补充。
  # 动镜实际位移 = 千分尺读数变化 × scale_factor
  scale_factor: 0.05

experiment:
  max_auto_seconds: 60
  center_stable_frames: 5
  center_min_confidence: 0.18
  center_max_jitter_px: 12

agent:
  llm:
    provider: "deepseek"
    api_base: "https://api.deepseek.com"
    model: "deepseek-v4-flash"
    timeout: 30
    max_tokens: 2000
  rag:
    top_k: 4

uncertainty:
  confidence_level: 0.95
  symmetry_enabled: true

ui:
  theme: "light"
  language: "zh"
  window_size: [1600, 1000]
